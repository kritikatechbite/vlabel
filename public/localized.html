<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Vlabel Preferences</title>

    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="bgpage">

    <div class="overlay">

        <section class="cookie"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="cookieTitle">

            <button
                class="close"
                id="closeBtn"
                data-choice="closed"
                aria-label="Close">
                ×
            </button>

            <div class="mark">V</div>

            <!-- JS updates this -->
            <h2 id="cookieTitle">
                Cookie preferences
            </h2>

            <!-- JS updates this -->
            <p id="cookieMessage">
                We use essential cookies to keep Vlabel working.
                Optional cookies can help us understand how the site is used.
            </p>

            <div class="actions">

                <!-- JS updates this -->
                <button
                    class="accept"
                    id="acceptBtn"
                    data-choice="accepted">
                    Accept
                </button>

                <!-- JS updates this -->
                <button
                    class="decline"
                    id="declineBtn"
                    data-choice="declined">
                    Decline
                </button>

            </div>

        </section>

    </div>

    <script src="assets/localized.js"></script>

</body>
</html>
