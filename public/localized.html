<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Vlabel Preferences</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="bgpage">
    <div class="overlay">
        <section class="cookie" role="dialog" aria-modal="true"><button class="close" data-choice="closed"
                aria-label="Close">×</button>
            <div class="mark">V</div>
            <h2>Cookie preferences</h2>
            <p>We use essential cookies to keep Vlabel working. Optional cookies can help us understand how the site is
                used.</p>
            <div class="actions"><button class="accept" id="accept" data-choice="accepted">Accept</button><button
                    class="decline" id="decline" data-choice="declined">Decline</button></div>
        </section>
    </div>
    <script src="assets/localized.js"></script>
</body>

</html>
